<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <div class="register-container">

    <div class="register-box">

        <h1>Let's get started 🎉</h1>

        <p class="register-subtitle">
            Register to start saving and investing with PiggyVest today!
        </p>

        <form>

            <label>First & Last Name <span>*</span></label>
            <input type="text" placeholder="adebola">

            <label>Email address <span>*</span></label>
            <input type="email" placeholder="@gmail">

            <label>Phone number <span>*</span></label>
            <input type="tel" placeholder="+234">

            <label>Create a password <span>*</span></label>

            <div class="password-input">
                <input type="password" placeholder="Password">
                <button type="button">adebola</button>
            </div>

            <button class="register-btn" type="submit">
                Create Account
            </button>

        </form>

    </div>

</div>
    
</body>
</html>
